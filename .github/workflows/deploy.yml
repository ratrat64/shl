name: Deploy shl

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_checks: ${{ steps.changes.outputs.run_checks }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Check changed files
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo 'run_checks=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" HEAD -- . ':(exclude)AGENTS.md' ':(exclude)README.md' ':(exclude)docs' ':(exclude)aid-docs'; then
            echo 'Docs-only change; skipping test gate'
            echo 'run_checks=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run_checks=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.2-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.4.2-
      - uses: actions/configure-pages@v6.0.0
      - name: Install dependencies
        run: bun ci
      - name: Format sources
        run: bun run format
      - name: Test
        if: needs.changes.outputs.run_checks == 'true'
        env:
          SHL_REQUIRE_BROWSER: "1"
        run: bun test --timeout 30000 ./test/build.test.mjs
      - name: Build
        run: bun build.mjs
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
