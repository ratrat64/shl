# === EDGE CASE TEST ENTRIES ===

# State tag combinations
hidden-only:
  url: https://example.com/hidden-only
  title: Hidden only - omitted from listings by default
  tags: [hidden]

broken-only:
  url: https://example.com/broken-only
  title: Broken only - orange-red warning
  tags: [broken]

disabled-only:
  url: https://example.com/disabled-only
  title: Disabled only - no forwarding, copy-only destination
  tags: [disabled]

hidden-broken:
  url: https://example.com/hidden-broken
  title: Hidden + broken - omitted with warning
  tags: [hidden, broken]

hidden-disabled:
  url: https://example.com/hidden-disabled
  title: Hidden + disabled - omitted, no forwarding
  tags: [hidden, disabled]

broken-disabled:
  url: https://example.com/broken-disabled
  title: Broken + disabled - grey overrides orange-red
  tags: [broken, disabled]

all-three-states:
  url: https://example.com/all-three-states
  title: Hidden + broken + disabled - all states
  tags: [hidden, broken, disabled]

# Script launchers with state combinations
script-enabled:
  url: https://example.com/script-enabled.sh
  title: Enabled script launcher
  tags: [script, shell]

script-hidden:
  url: https://example.com/script-hidden.sh
  title: Hidden script launcher
  tags: [script, hidden, shell]

script-disabled:
  url: https://example.com/script-disabled.sh
  title: Disabled script - inert launcher exits 1
  tags: [script, disabled]

script-broken:
  url: https://example.com/script-broken.sh
  title: Broken script - warning but launcher works
  tags: [script, broken]

script-all-states:
  url: https://example.com/script-all.sh
  title: Script with all state tags
  tags: [script, hidden, broken, disabled]

# Deeply nested directories
deep:
  level1:
    level2:
      level3:
        level4:
          level5:
            deep-link:
              url: https://example.com/deep/nested/link
              title: Five levels deep
              tags: [deep, nesting]

# Long URL and title
long-destination:
  url: https://very-long-subdomain.example.com/very/long/path/that/keeps/going/and/going/with/many/segments/and/query?param1=value1&param2=value2&param3=value3#fragment
  title: This is a very long title that tests how the UI handles extended text content without breaking layout or truncation inappropriately
  tags: [long, test]

# URL with special characters in path/query
special-url:
  url: https://example.com/path/with~tilde/and.period/and_underscore/and-dash/and%20space/and+plus?query=value%20with%20spaces&array[]=1&array[]=2#fragment-with-dash
  title: Special characters in URL
  tags: [special-chars, url-test]

# Port and non-standard URLs
non-standard-port:
  url: https://example.com:8443/admin/dashboard
  title: Non-standard HTTPS port
  tags: [port, admin]

http-with-port:
  url: http://localhost:3000/dev
  title: HTTP with port (allowed for local dev)
  tags: [http, local, dev]

# Descriptive tags that resemble state tags (should NOT trigger states)
descriptive-tags:
  url: https://example.com/descriptive
  title: Tags that look like states but aren't
  tags:
    [
      hiddenish,
      broken-example,
      disabled-test,
      my-hidden-tag,
      broken_link,
      disabled_feature,
    ]

# State tags explicitly renamed to valid lowercase names
mixed-case-hidden:
  url: https://example.com/mixed-case-hidden
  title: Hidden with mixed case tag
  tags: [hidden, documentation]

mixed-case-broken:
  url: https://example.com/mixed-case-broken
  title: Broken with mixed case tag
  tags: [broken, test]

mixed-case-disabled:
  url: https://example.com/mixed-case-disabled
  title: Disabled with mixed case tag
  tags: [disabled, test]

# Multiple descriptive tags
many-tags:
  url: https://example.com/many-tags
  title: Many descriptive tags on one line
  tags:
    [tag1, tag2, tag3, tag4, tag5, tag6, tag7, tag8, tag9, tag10, tag11, tag12]

# Title with special characters
special-title:
  url: https://example.com/special-title
  title: "Title with 'quotes', <angle brackets>, & ampersand, and unicode: café 🎉"
  tags: [special-title, unicode]

# Empty title (should be allowed as empty string)
no-title:
  url: https://example.com/no-title
  tags: [minimal]

# Unicode in tags
unicode-tags:
  url: https://example.com/unicode-tags
  title: Unicode tag test
  tags: [café, naïve, résumé, 日本語, 中文, emoji-party]

# Trailing slash in URL (should be preserved)
trailing-slash:
  url: https://example.com/path/with/trailing/slash/
  title: URL with trailing slash
  tags: [trailing-slash]

# Root path only
root-path:
  url: https://example.com/
  title: Root path only
  tags: [root]

# Very short code (minimum valid)
a: https://example.com/minimal-code

# Code with dots, underscores, hyphens
code-with.dots: https://example.com/dots
code_with_underscores: https://example.com/underscores
code-with-hyphens: https://example.com/hyphens
code.with-mixed_separators: https://example.com/mixed

# Large nested structure for directory testing
projects:
  frontend:
    react:
      app:
        url: https://react.dev/
        title: React App
        tags: [frontend, react]
      hooks:
        url: https://react.dev/learn/reusing-logic-with-custom-hooks
        title: Custom Hooks
        tags: [frontend, react, hooks]
    vue:
      app:
        url: https://vuejs.org/
        title: Vue App
        tags: [frontend, vue]
      composition:
        url: https://vuejs.org/guide/extras/composition-api-faq.html
        title: Composition API
        tags: [frontend, vue, composition-api]
  backend:
    node:
      express:
        url: https://expressjs.com/
        title: Express.js
        tags: [backend, node, express]
      fastify:
        url: https://www.fastify.io/
        title: Fastify
        tags: [backend, node, fastify]
    go:
      gin:
        url: https://gin-gonic.com/
        title: Gin Framework
        tags: [backend, go, gin]
      chi:
        url: https://github.com/go-chi/chi
        title: Chi Router
        tags: [backend, go, chi]

# Test entries for search behavior
search-test-exact:
  url: https://example.com/search-exact
  title: Exact tag search test
  tags: [release-notes, documentation]

search-test-partial:
  url: https://example.com/search-partial
  title: Partial text search test
  tags: [release, notes]

# Entries to test collision detection (these would fail validation if uncommented)
# Reserved names (would be rejected):
# index: https://example.com/reserved
# 404: https://example.com/reserved
# assets: https://example.com/reserved

# Invalid codes (would be rejected):
# "invalid code": https://example.com/invalid  # space not allowed
# "UPPERCASE": https://example.com/uppercase  # would collide with lowercase
